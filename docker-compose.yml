# Environnement local : PostgreSQL + Mailpit.
# L'API (php artisan serve) et le front (npm run dev) tournent sur le poste, pas dans Docker.
services:
  postgres:
    image: postgres:16-alpine
    container_name: residences-postgres
    environment:
      POSTGRES_USER: residences
      POSTGRES_PASSWORD: residences
      POSTGRES_DB: residences
    ports:
      - "5433:5432" # 5433 côté poste pour ne pas heurter un PostgreSQL déjà installé
    volumes:
      - residences-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residences -d residences"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: residences-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # boîte de réception web : http://localhost:8025

volumes:
  residences-pgdata:
